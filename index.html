<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMYS V.1.2 PRO - Sistem Skrining Puskesmas</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root { --bg-gradient: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); --glass-bg: rgba(255, 255, 255, 0.4); --text-main: #1e293b; }
        .dark { --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); --glass-bg: rgba(30, 41, 59, 0.7); --text-main: #f1f5f9; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; transition: background 0.3s ease; }
        .glass { background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .animate-fade { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .radio-custom:checked + .radio-label { background-color: #3b82f6; color: white; border-color: #3b82f6; transform: scale(1.05); }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="p-4 md:p-8 flex justify-center items-start">

    <!-- Navigasi Atas -->
    <div class="fixed top-4 right-4 flex gap-2 no-print z-50">
        <button onclick="handleRekapanAccess()" class="p-3 rounded-full glass hover:scale-105 transition shadow-lg text-xs font-bold bg-blue-600 text-white hover:bg-blue-700">📊 Rekapan Data</button>
        <button onclick="toggleDarkMode()" class="p-3 rounded-full glass hover:scale-110 transition shadow-lg">🌙</button>
    </div>

    <div id="app" class="w-full max-w-4xl glass rounded-[32px] p-6 md:p-10 relative overflow-hidden shadow-2xl">
        
        <!-- Landing Page -->
        <div id="step-landing" class="text-center py-10 animate-fade">
            <div class="inline-block bg-blue-100 text-blue-700 text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-wider mb-3">
                Versi 1.2 PRO • Secured Cloud Direct
            </div>
            <h1 class="text-3xl font-extrabold text-slate-800 dark:text-white mb-1">MMYS V.1.2 <span class="text-blue-500">PRO</span></h1>
            <p class="text-slate-500 dark:text-slate-400 mb-8 italic text-sm">Puskesmas Sampanahan Digital Ecosystem</p>
            
            <div class="max-w-md mx-auto space-y-4 text-left bg-white/40 dark:bg-slate-800/40 p-6 rounded-3xl border border-white">
                <div class="flex flex-col gap-2">
                    <label class="text-xs font-bold text-slate-600 dark:text-slate-300 uppercase">Nama Peserta</label>
                    <input type="text" id="initNama" placeholder="Hanya huruf..." class="p-3 rounded-xl bg-white dark:bg-slate-700 border border-slate-200 focus:ring-2 focus:ring-blue-400 outline-none">
                </div>
                <div class="flex flex-col gap-2">
                    <label class="text-xs font-bold text-slate-600 dark:text-slate-300 uppercase">Asal Sekolah / Madrasah</label>
                    <input type="text" id="initSekolah" placeholder="Contoh: SMPN 1 Sampanahan" class="p-3 rounded-xl bg-white dark:bg-slate-700 border border-slate-200 focus:ring-2 focus:ring-blue-400 outline-none">
                </div>
                <div class="flex flex-col gap-2">
                    <label class="text-xs font-bold text-slate-600 dark:text-slate-300 uppercase">Usia (7-18 Tahun)</label>
                    <input type="number" id="initUsia" placeholder="Contoh: 14" class="p-3 rounded-xl bg-white dark:bg-slate-700 border border-slate-200 focus:ring-2 focus:ring-blue-400 outline-none">
                </div>
                <button onclick="checkAutoMode()" id="btnStart" class="w-full mt-4 bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 transition active:scale-95 shadow-lg flex justify-center items-center gap-2">
                    Mulai Skrining Sekarang
                </button>
                <button onclick="handleRekapanAccess()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl hover:bg-emerald-700 transition active:scale-95 shadow flex justify-center items-center gap-2 text-xs">
                    🔒 Lihat Rekapan Cloud Sheet
                </button>
            </div>
        </div>

        <!-- Main Form -->
        <div id="main-form" class="hidden animate-fade">
            <div class="mb-6 no-print">
                <div class="flex justify-between text-xs font-bold text-blue-600 mb-2 uppercase tracking-widest">
                    <span id="progress-text">Progres: 0%</span>
                    <span id="question-counter">Soal 0/6</span>
                </div>
                <div class="w-full bg-slate-200 dark:bg-slate-700 h-2 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-blue-500 h-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>

            <div id="questions-container" class="space-y-8"></div>

            <div class="mt-10 flex gap-4 no-print">
                <button onclick="prosesSkoring()" id="btnSubmit" class="w-full bg-slate-800 dark:bg-blue-600 text-white font-bold py-4 rounded-2xl hover:opacity-90 transition active:scale-95 shadow-xl">
                    Kirim & Lihat Analisis
                </button>
            </div>
        </div>

        <!-- Result Section -->
        <div id="result-section" class="hidden animate-fade pt-4">
            <div class="flex justify-between items-center no-print mb-6">
                <button onclick="location.reload()" class="text-sm text-slate-500 flex items-center gap-2 hover:text-blue-600">← Kembali</button>
                <div class="flex gap-2">
                    <span id="sync-status" class="text-[10px] self-center px-2 py-1 rounded-lg bg-amber-100 text-amber-700 font-bold uppercase tracking-tighter">Mengirim ke Cloud...</span>
                    <button onclick="exportToExcel()" class="bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-bold">📊 Excel</button>
                </div>
            </div>
            
            <div id="print-area" class="text-center">
                <h2 class="font-bold text-xl text-slate-800 dark:text-white mb-6">LAPORAN SKRINING MMYS V.1.2</h2>
                
                <div class="grid grid-cols-2 gap-4 mb-8 text-sm p-6 bg-white/30 dark:bg-slate-800/30 rounded-2xl text-left border border-white/20">
                    <p><span class="opacity-60">Nama:</span> <b id="resNama"></b></p>
                    <p><span class="opacity-60">Asal Sekolah:</span> <b id="resSekolah"></b></p>
                    <p><span class="opacity-60">Usia:</span> <b id="resUsia"></b> th</p>
                    <p><span class="opacity-60">Tanggal:</span> <b id="resTgl"></b></p>
                    <p class="col-span-2"><span class="opacity-60">ID Transaksi:</span> <b id="resID" class="text-[10px] font-mono"></b></p>
                </div>

                <div class="grid md:grid-cols-2 gap-6 text-left">
                    <div id="boxAnxietas" class="p-6 rounded-2xl border-2 transition-all">
                        <h4 class="text-xs font-bold uppercase opacity-60 mb-2">Skala Ansietas</h4>
                        <p id="resAnx" class="text-lg font-bold mb-1"></p>
                        <span id="scoreAnx" class="text-xs font-medium px-2 py-1 rounded bg-black/5"></span>
                    </div>
                    <div id="boxDepresi" class="p-6 rounded-2xl border-2 transition-all">
                        <h4 class="text-xs font-bold uppercase opacity-60 mb-2">Skala Depresi</h4>
                        <p id="resDep" class="text-lg font-bold mb-1"></p>
                        <span id="scoreDep" class="text-xs font-medium px-2 py-1 rounded bg-black/5"></span>
                    </div>
                </div>

                <div class="mt-8 py-6 border-t border-dashed border-slate-300">
                    <div id="qrcode" class="flex justify-center mb-2"></div>
                    <p class="text-[10px] opacity-50 font-bold uppercase tracking-widest">Validasi Puskesmas Digital MMYS V.1.2</p>
                </div>
            </div>

            <button onclick="window.print()" class="no-print w-full mt-6 bg-white border-2 border-slate-800 text-slate-800 font-bold py-3 rounded-xl">🖨️ Cetak Hasil</button>
        </div>
    </div>

    <script>
        const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbzzhAHpG7xA0BuWe7mSvzn7d3CYo4-sV_Csu5en137gPiuxK22xtl-B5OI3MRFuGlMbLg/exec';
        const REKAPAN_PIN = "1234"; // PIN Akses Rekapan (Dapat diubah sesuai kebutuhan)

        let currentMode = '', lastResult = null;
        let isRekapanUnlocked = false; // Status Autentikasi PIN
        let cachedRekapanData = null;  // Tempat penyimpanan sementara data rekapan (Anti-Loading Berulang)

        document.getElementById('initNama').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^a-zA-Z\s]/g, '');
        });

        const questions = {
            anak: {
                A: ["Sering merasa khawatir/tidak tenang, tegang, deg-degan terhadap hal negatif.", "Berpikir berlebihan & sulit mengendalikan diri terhadap hal negatif.", "Sulit tidur/konsentrasi saat memikirkan hal negatif."],
                B: ["Sering sedih/tertekan tanpa sebab jelas.", "Kehilangan minat pada kegiatan yang biasanya disukai.", "Sering capek, sulit tidur, dan sulit fokus belajar."]
            },
            remaja: {
                A: ["Saya sering merasa khawatir, tegang, atau gelisah terhadap masa depan/hal negatif.", "Saya merasa sulit mengontrol pikiran berlebihan saya.", "Saya merasa sulit mengontrol pikiran berlebihan saya."],
                B: ["Saya merasa sedih, hampa, atau putus asa hampir setiap hari.", "Saya kehilangan minat pada hobi atau teman-teman saya.", "Saya merasa sangat lelah atau tidak berenergi untuk beraktivitas."]
            }
        };

        function toggleDarkMode() { document.documentElement.classList.toggle('dark'); }

        function checkAutoMode() {
            const nama = document.getElementById('initNama').value.trim();
            const sekolah = document.getElementById('initSekolah').value.trim();
            const usia = parseInt(document.getElementById('initUsia').value);
            
            if(!nama || !sekolah || isNaN(usia)) return Swal.fire('Error', 'Harap lengkapi Nama, Asal Sekolah, dan Usia terlebih dahulu', 'error');
            if(usia < 7 || usia > 18) return Swal.fire('Error', 'Usia harus 7-18 tahun', 'warning');
            
            currentMode = (usia <= 9) ? 'anak' : 'remaja';
            renderQuestions();
        }

        function renderQuestions() {
            document.getElementById('step-landing').classList.add('hidden');
            document.getElementById('main-form').classList.remove('hidden');
            const container = document.getElementById('questions-container');
            
            let html = '<div class="space-y-6">';
            ['A', 'B'].forEach(type => {
                const label = type === 'A' ? 'ANXIETAS' : 'DEPRESI';
                html += `<h3 class="font-bold text-blue-600 dark:text-blue-400 text-sm tracking-widest underline underline-offset-8">SKALA ${label}</h3>`;
                questions[currentMode][type].forEach((q, i) => {
                    html += `
                        <div class="bg-white/50 dark:bg-slate-800/50 p-5 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4 border border-white/20 hover:border-blue-300 transition-all">
                            <p class="text-sm flex-1"><span class="font-bold text-blue-500 mr-2">${i+1}.</span> ${q}</p>
                            <div class="flex gap-2 w-full md:w-auto">
                                <label class="flex-1 md:w-20 cursor-pointer">
                                    <input type="radio" name="${type}${i}" value="1" onchange="updateProgress()" class="hidden radio-custom">
                                    <div class="radio-label text-center py-2 rounded-xl bg-white dark:bg-slate-700 border border-slate-200 text-xs font-bold transition-all">Ya</div>
                                </label>
                                <label class="flex-1 md:w-20 cursor-pointer">
                                    <input type="radio" name="${type}${i}" value="0" onchange="updateProgress()" class="hidden radio-custom">
                                    <div class="radio-label text-center py-2 rounded-xl bg-white dark:bg-slate-700 border border-slate-200 text-xs font-bold transition-all">Tidak</div>
                                </label>
                            </div>
                        </div>
                    `;
                });
            });
            container.innerHTML = html + '</div>';
            window.scrollTo(0,0);
        }

        function updateProgress() {
            let answered = 0;
            ['A', 'B'].forEach(type => {
                for(let i=0; i<3; i++) {
                    if(document.querySelector(`input[name="${type}${i}"]:checked`)) answered++;
                }
            });
            const pct = Math.round((answered/6)*100);
            document.getElementById('progress-bar').style.width = pct + '%';
            document.getElementById('progress-text').innerText = `Progres: ${pct}%`;
            document.getElementById('question-counter').innerText = `Soal ${answered}/6`;
        }

        async function prosesSkoring() {
            let belumDiisi = [];
            ['A', 'B'].forEach(type => {
                const namaSkala = type === 'A' ? 'Ansietas' : 'Depresi';
                for(let i=0; i<3; i++) {
                    if(!document.querySelector(`input[name="${type}${i}"]:checked`)) {
                        belumDiisi.push(`Skala ${namaSkala} No. ${i+1}`);
                    }
                }
            });

            if(belumDiisi.length > 0) {
                return Swal.fire({
                    title: 'Belum Lengkap!',
                    html: `<div class="text-left text-sm p-2 text-rose-600 font-semibold">Silakan isi soal berikut:<br>• ${belumDiisi.join('<br>• ')}</div>`,
                    icon: 'warning'
                });
            }

            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerHTML = `<span class="animate-spin mr-2">🌀</span> Memproses Skor...`;

            const getScore = (p) => {
                let total = 0;
                for(let i=0; i<3; i++) {
                    const el = document.querySelector(`input[name="${p}${i}"]:checked`);
                    if(el) total += parseInt(el.value);
                }
                return total;
            };

            try {
                const scoreA = getScore('A');
                const scoreB = getScore('B');

                const data = {
                    id: `MMYS-${Date.now()}-${document.getElementById('initNama').value.substring(0,3).toUpperCase()}`,
                    nama: document.getElementById('initNama').value,
                    sekolah: document.getElementById('initSekolah').value,
                    usia: document.getElementById('initUsia').value,
                    tanggal: new Date().toLocaleDateString('id-ID'),
                    scoreA, scoreB,
                    interA: interpret(scoreA),
                    interB: interpret(scoreB)
                };

                displayResult(data);
                syncToSheets(data);

            } catch (error) {
                console.error("Internal Crash Log: ", error);
                Swal.fire({
                    title: 'Error Pemrosesan',
                    text: `Detail Masalah: ${error.message}`,
                    icon: 'error'
                });
            } finally {
                btn.disabled = false;
                btn.innerHTML = `Kirim & Lihat Analisis`;
            }
        }

        function interpret(s) {
            if(s >= 2) return { text: "Gejala Berat", color: "border-rose-500 bg-rose-50 text-rose-700" };
            if(s === 1) return { text: "Gejala Ringan", color: "border-amber-500 bg-amber-50 text-amber-700" };
            return { text: "Normal / Stabil", color: "border-emerald-500 bg-emerald-50 text-emerald-700" };
        }

        function displayResult(d) {
            lastResult = d;
            document.getElementById('resNama').innerText = d.nama;
            document.getElementById('resSekolah').innerText = d.sekolah;
            document.getElementById('resUsia').innerText = d.usia;
            document.getElementById('resTgl').innerText = d.tanggal;
            document.getElementById('resID').innerText = d.id;

            document.getElementById('resAnx').innerText = d.interA.text;
            document.getElementById('scoreAnx').innerText = `Skor: ${d.scoreA}/3`;
            document.getElementById('boxAnxietas').className = `p-6 rounded-2xl border-2 transition-all ${d.interA.color}`;

            document.getElementById('resDep').innerText = d.interB.text;
            document.getElementById('scoreDep').innerText = `Skor: ${d.scoreB}/3`;
            document.getElementById('boxDepresi').className = `p-6 rounded-2xl border-2 transition-all ${d.interB.color}`;

            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = "";
            
            if (typeof QRCode !== "undefined") {
                new QRCode(qrContainer, { text: d.id, width: 80, height: 80 });
            }

            document.getElementById('main-form').classList.add('hidden');
            document.getElementById('result-section').classList.remove('hidden');
        }

        async function syncToSheets(data) {
            const status = document.getElementById('sync-status');
            try {
                await fetch(SHEETS_URL, { 
                    method: 'POST', 
                    mode: 'cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(data) 
                });

                // Jika ada data baru dikirim, tambahkan otomatis ke cache rekapan tanpa reload data ulang dari server
                if (cachedRekapanData) {
                    cachedRekapanData.unshift(data);
                }

                if(status) {
                    status.innerText = "Synced to Cloud";
                    status.className = "text-[10px] self-center px-2 py-1 rounded-lg bg-emerald-100 text-emerald-700 font-bold uppercase";
                }
            } catch (e) { 
                if(status) {
                    status.innerText = "Gagal Sync";
                    status.className = "text-[10px] self-center px-2 py-1 rounded-lg bg-rose-100 text-rose-700 font-bold uppercase";
                }
            }
        }

        /* --- LOGIKA AUTENTIKASI PIN SECURITY LOCK & IKON MATA --- */
        function handleRekapanAccess() {
            if (isRekapanUnlocked) {
                showRekapanModal();
            } else {
                promptPinLock();
            }
        }

        function promptPinLock() {
            Swal.fire({
                title: '🔒 Masukkan Kata Sandi',
                text: 'Akses Rekapan Data Terproteksi',
                html: `
                    <div class="relative w-full max-w-xs mx-auto mt-3">
                        <input type="password" id="pinInput" placeholder="Masukkan PIN..." class="w-full p-3 pr-10 text-center text-lg font-bold border-2 border-slate-300 rounded-xl focus:border-blue-500 outline-none">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-blue-600 focus:outline-none text-lg">
                            👁️
                        </button>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'Buka Rekapan',
                cancelButtonText: 'Batal',
                confirmButtonColor: '#2563eb',
                preConfirm: () => {
                    const pin = document.getElementById('pinInput').value;
                    if (pin !== REKAPAN_PIN) {
                        Swal.showValidationMessage('Kata Sandi / PIN Salah!');
                    }
                    return pin === REKAPAN_PIN;
                }
            }).then(res => {
                if (res.isConfirmed) {
                    isRekapanUnlocked = true; // Sesi Terbuka
                    showRekapanModal();
                }
            });
        }

        function togglePasswordVisibility() {
            const input = document.getElementById('pinInput');
            if (input) {
                input.type = (input.type === 'password') ? 'text' : 'password';
            }
        }

        function lockRekapanSession() {
            isRekapanUnlocked = false;
            Swal.fire('Terkunci', 'Sesi rekapan berhasil dikunci kembali.', 'info');
        }

        /* --- MENAMPILKAN MODAL REKAPAN (SEKALI FETCH & AUTO-UPDATE DATA BARU) --- */
        async function showRekapanModal() {
            // Jika data sudah ada di cache (pernah diambil), tampilkan langsung tanpa muat ulang
            if (cachedRekapanData && cachedRekapanData.length > 0) {
                renderRekapanTableUI(cachedRekapanData);
                return;
            }

            Swal.fire({
                title: 'Mengambil Data...',
                text: 'Menghubungkan langsung ke Google Sheet',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000);

                const res = await fetch(SHEETS_URL, { signal: controller.signal });
                clearTimeout(timeoutId);

                const cloudData = await res.json();

                if (Array.isArray(cloudData) && cloudData.length > 0) {
                    cachedRekapanData = cloudData.map(d => {
                        const values = Object.values(d);
                        
                        const idVal = d['ID Transaksi'] || d['id'] || values[0] || '-';
                        const namaVal = d['Nama Peserta'] || d['nama'] || values[1] || '-';
                        const sekolahVal = d['Asal Sekolah'] || d['sekolah'] || (values.length >= 10 ? values[2] : '-');
                        
                        const usiaIdx = values.length >= 10 ? 3 : 2;
                        const tglIdx = values.length >= 10 ? 4 : 3;
                        const scoreAIdx = values.length >= 10 ? 5 : 4;
                        const scoreBIdx = values.length >= 10 ? 7 : 6;

                        const usiaVal = d['Usia'] || d['usia'] || values[usiaIdx] || '-';
                        const tglVal = d['Tanggal Skrining'] || d['tanggal'] || values[tglIdx] || '-';
                        
                        const scoreAVal = parseInt(d['Skor Ansietas'] ?? d['scoreA'] ?? values[scoreAIdx] ?? 0);
                        const scoreBVal = parseInt(d['Skor Depresi'] ?? d['scoreB'] ?? values[scoreBIdx] ?? 0);

                        return {
                            id: idVal,
                            nama: namaVal,
                            sekolah: sekolahVal,
                            usia: usiaVal,
                            tanggal: tglVal,
                            scoreA: isNaN(scoreAVal) ? 0 : scoreAVal,
                            scoreB: isNaN(scoreBVal) ? 0 : scoreBVal,
                            interA: interpret(isNaN(scoreAVal) ? 0 : scoreAVal),
                            interB: interpret(isNaN(scoreBVal) ? 0 : scoreBVal)
                        };
                    });
                }
            } catch (err) {
                if (err.name === 'AbortError') {
                    return Swal.fire('Koneksi Lambat', 'Waktu permintaan habis (Timeout 10d). Silakan coba lagi.', 'warning');
                }
                return Swal.fire('Error Koneksi', 'Gagal mengambil data dari Google Sheet.', 'error');
            }

            if (!cachedRekapanData || !cachedRekapanData.length) {
                return Swal.fire('Rekapan Kosong', 'Tidak ada data di Google Sheet saat ini.', 'info');
            }

            renderRekapanTableUI(cachedRekapanData);
        }

        /* --- RENDER TABEL & RINGKASAN REKAPAN --- */
        function renderRekapanTableUI(history) {
            const totalPeserta = history.length;
            let anxNormal = 0, anxRingan = 0, anxBerat = 0;
            let depNormal = 0, depRingan = 0, depBerat = 0;

            history.forEach(h => {
                if(h.scoreA >= 2) anxBerat++; else if(h.scoreA === 1) anxRingan++; else anxNormal++;
                if(h.scoreB >= 2) depBerat++; else if(h.scoreB === 1) depRingan++; else depNormal++;
            });

            const rows = history.map((h, i) => `
                <tr class="border-b text-left text-xs hover:bg-slate-50 dark:hover:bg-slate-700">
                    <td class="p-2 font-bold">${i+1}</td>
                    <td class="p-2 font-medium">${h.nama}</td>
                    <td class="p-2 text-blue-600 dark:text-blue-400 font-semibold">${h.sekolah}</td>
                    <td class="p-2">${h.usia} th</td>
                    <td class="p-2 text-[10px] opacity-75">${h.tanggal}</td>
                    <td class="p-2 font-semibold ${h.scoreA >= 2 ? 'text-rose-600' : h.scoreA === 1 ? 'text-amber-600' : 'text-emerald-600'}">${h.scoreA} (${h.interA ? h.interA.text : '-'})</td>
                    <td class="p-2 font-semibold ${h.scoreB >= 2 ? 'text-rose-600' : h.scoreB === 1 ? 'text-amber-600' : 'text-emerald-600'}">${h.scoreB} (${h.interB ? h.interB.text : '-'})</td>
                </tr>
            `).join('');

            const contentHtml = `
                <div class="text-left space-y-4">
                    <div class="flex justify-between items-center">
                        <button onclick="forceRefreshData()" class="text-xs bg-slate-200 hover:bg-slate-300 px-3 py-1.5 rounded-lg font-bold text-slate-700 flex items-center gap-1">🔄 Muat Ulang Data</button>
                        <button onclick="lockRekapanSession()" class="text-xs bg-rose-100 hover:bg-rose-200 text-rose-700 px-3 py-1.5 rounded-lg font-bold flex items-center gap-1">🔒 Kunci / Keluar</button>
                    </div>

                    <div class="grid grid-cols-3 gap-2 text-center text-xs">
                        <div class="p-3 bg-blue-50 dark:bg-slate-800 rounded-xl border border-blue-200">
                            <p class="text-slate-500 text-[10px] font-bold uppercase">Total Peserta</p>
                            <p class="text-xl font-black text-blue-600">${totalPeserta}</p>
                        </div>
                        <div class="p-3 bg-amber-50 dark:bg-slate-800 rounded-xl border border-amber-200">
                            <p class="text-slate-500 text-[10px] font-bold uppercase">Ansietas Berat</p>
                            <p class="text-xl font-black text-rose-600">${anxBerat}</p>
                            <p class="text-[9px] text-slate-400">Ringan: ${anxRingan} | Normal: ${anxNormal}</p>
                        </div>
                        <div class="p-3 bg-purple-50 dark:bg-slate-800 rounded-xl border border-purple-200">
                            <p class="text-slate-500 text-[10px] font-bold uppercase">Depresi Berat</p>
                            <p class="text-xl font-black text-rose-600">${depBerat}</p>
                            <p class="text-[9px] text-slate-400">Ringan: ${depRingan} | Normal: ${depNormal}</p>
                        </div>
                    </div>

                    <div class="max-h-64 overflow-y-auto border border-slate-200 rounded-xl">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-slate-100 dark:bg-slate-800 text-[10px] font-bold uppercase sticky top-0">
                                <tr>
                                    <th class="p-2">#</th>
                                    <th class="p-2">Nama</th>
                                    <th class="p-2">Sekolah</th>
                                    <th class="p-2">Usia</th>
                                    <th class="p-2">Tanggal</th>
                                    <th class="p-2">Ansietas</th>
                                    <th class="p-2">Depresi</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rows}
                            </tbody>
                        </table>
                    </div>
                    <p class="text-[10px] text-slate-400 text-center font-semibold">MMYS V.1.2 PRO • Cloud Direct Synchronized</p>
                </div>
            `;

            Swal.fire({
                title: '📊 Rekapan Cloud Google Sheet',
                html: contentHtml,
                width: '800px',
                showCancelButton: true,
                confirmButtonText: '📥 Export Semua ke Excel',
                cancelButtonText: 'Tutup',
                confirmButtonColor: '#059669'
            }).then(res => {
                if(res.isConfirmed) { exportAllToExcel(history); }
            });
        }

        // Tombol paksa muat ulang data dari server (jika dibutuhkan)
        function forceRefreshData() {
            cachedRekapanData = null;
            showRekapanModal();
        }

        function exportAllToExcel(dataList) {
            if(!dataList || !dataList.length) return;
            const exportRows = dataList.map((d, i) => ({
                "No": i + 1,
                "ID Transaksi": d.id,
                "Nama Peserta": d.nama,
                "Asal Sekolah": d.sekolah,
                "Usia": d.usia,
                "Tanggal Skrining": d.tanggal,
                "Skor Ansietas": d.scoreA,
                "Kesimpulan Ansietas": d.interA ? d.interA.text : '',
                "Skor Depresi": d.scoreB,
                "Kesimpulan Depresi": d.interB ? d.interB.text : ''
            }));

            const ws = XLSX.utils.json_to_sheet(exportRows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Rekapan_MMYS");
            XLSX.writeFile(wb, `Rekapan_Skrining_MMYS_V1.2_${new Date().toISOString().slice(0,10)}.xlsx`);
        }

        function exportToExcel() {
            if(!lastResult) return;
            const exportData = {
                "ID Transaksi": lastResult.id,
                "Nama Peserta": lastResult.nama,
                "Asal Sekolah": lastResult.sekolah,
                "Usia": lastResult.usia,
                "Tanggal Skrining": lastResult.tanggal,
                "Skor Ansietas": lastResult.scoreA,
                "Kesimpulan Ansietas": lastResult.interA.text,
                "Skor Depresi": lastResult.scoreB,
                "Kesimpulan Depresi": lastResult.interB.text
            };
            const ws = XLSX.utils.json_to_sheet([exportData]);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "MMYS_Data");
            XLSX.writeFile(wb, `MMYS_${lastResult.nama}.xlsx`);
        }
    </script>
</body>
</html>
